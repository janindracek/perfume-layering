tml"]}, "carrotseed": {"name": "Carrot seed", "tier": "A", "phase": "top", "descriptors": "sweet fresh herbal cumin carrot green spicy", "source": ["Daucus carota fruit oil, The Good Scents Company (Luebke 1994)", "https://www.thegoodscentscompany.com/data/es1024732.html"]}, "cashmeran": {"name": "Cashmeran", "aka": "musk indanone, an IFF material", "tier": "A", "phase": "base", "descriptors": "Diffusive, spicy, musk-like odor with strong floral reinforcement. Powdery, velvet nuance. Long lasting. Aromatic, apple, earthy, woody, red fruit, pine.", "source": ["Cashmeran (IFF), quoted on The Good Scents Company", "https://www.thegoodscentscompany.com/data/rw1024092.html"], "alt": ["rich spicy musk woody clean", "The Good Scents Company (1996)", "https://www.thegoodscentscompany.com/data/rw1024092.html"], "confuse": ["Sandalwood and white musk.", "It is neither, and it is in the base of Trudon II, which you wear most days. The velvet and the faint pine in IFF's own description are the handles."], "role": "A soft base that reads as warmth without sweetness. Half of what Trudon II is at bedtime, with the ambroxan."}, "cedar": {"name": "Cedarwood", "aka": "Virginia or Texas cedar on most lists; both are junipers", "tier": "A", "phase": "base", "descriptors": "cedar woody oily balsam", "source": ["Cedarwood oil Virginia (Juniperus virginiana), The Good Scents Company (Luebke 1983)", "https://www.thegoodscentscompany.com/data/es1002992.html"], "alt": ["dry woody spicy old wood cistus", "Atlas cedarwood oil (Cedrus atlantica), The Good Scents Company (Luebke 1992)", "https://www.thegoodscentscompany.com/data/es1028531.html"], "confuse": ["Guaiac, and the botany does not help.", "Perfumery's cedar is two different things. Virginia and Texas cedarwood come from junipers and read as dry with a pencil note (Robertet's word). Atlas cedarwood is the true cedar and its string carries old wood and cistus, with IFF adding milky, warm, orris and leathery. A list rarely says which one. Dry and pencil-like: cedar. Sweet and powdery: look again, it is probably guaiac."], "arc": "A heart-to-base wood that changes little across a wear; TGSC gives the Virginia oil 388 hours on a strip.", "role": "A dry spine. It sits under four of the bottles you rated excellent without sweetening any of them."}, "chilli": {"name": "Chilli", "tier": "A", "phase": "top", "descriptors": null, "source": null}, "cinnamon": {"name": "Cinnamon", "tier": "A", "phase": "heart", "descriptors": "sweet spicy aromatic fruity aldehydic cinnamyl honey resinous woody", "source": ["Cinnamon bark oil Ceylon, The Good Scents Company (Luebke 1988)", "https://www.thegoodscentscompany.com/data/es1022811.html"]}, "clove": {"name": "Clove", "tier": "A", "phase": "heart", "descriptors": "spicy aromatic balsamic woody fruity minty phenolic powdery", "source": ["Clove bud oil, The Good Scents Company", "https://www.thegoodscentscompany.com/data/es1014452.html"]}, "coriander": {"name": "Coriander", "tier": "A", "phase": "top", "descriptors": null, "source": null}, "cyclamen": {"name": "Cyclamen (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "cypress": {"name": "Cypress", "tier": "A", "phase": "heart", "descriptors": null, "source": ["Cypress oil, The Good Scents Company", "https://www.thegoodscentscompany.com/data/es1004292.html"], "confuse": ["Pine.", "The cypress string on TGSC contains the word pine. Cypress is the drier, more herbal of the two, with none of pine's sap."]}, "cypriol": {"name": "Cypriol (nagarmotha)", "aka": "cypriol oil", "tier": "A", "phase": "base", "descriptors": "woody earthy dry spicy patchouli vetiver", "source": ["Cypriol (nagarmotha) oil, The Good Scents Company, citing Firmenich, IFF and Albert Vieille", "https://www.thegoodscentscompany.com/data/es1385381.html"], "confuse": ["Vetiver, on the trade's own admission.", "IFF describe it as having a nearly vetiver background, which is why the guaiac and cypriol pair in Bois d'Ebene gets filed under vetiver by people who know vetiver. It is drier and smokier than vetiver and has none of the root's sweetness."]}, "driedfruit": {"name": "Dried fruit (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "elemi": {"name": "Elemi", "aka": "the material shared by four of your excellent bottles", "tier": "A", "phase": "top", "descriptors": "fresh lemony peppery balsam green woody sweet spicy", "source": ["Canarium luzonicum (elemi) oil, The Good Scents Company (Luebke 1993)", "https://www.thegoodscentscompany.com/data/es1025511.html"], "confuse": ["Frankincense, but the confusion is in the naming, not in the nose.", "A Somali frankincense resin was itself called elemi for centuries, so the names have been crossed. In the nose elemi is the bright, lemony, peppery resin that leaves early; TGSC give it 20 hours on a strip against frankincense's 188."], "arc": "Loud in the first half hour, mostly gone by two hours on paper."}, "fenugreek": {"name": "Fenugreek", "tier": "A", "phase": "base", "descriptors": null, "source": null}, "frankincense": {"name": "Frankincense (olibanum)", "aka": "listed as incense on several bottles, which may be an accord", "tier": "A", "phase": "base", "descriptors": "terpenic incense peppery spicy old wood woody pine resinous", "source": ["Frankincense oil (Boswellia carteri), The Good Scents Company (Luebke 1987)", "https://www.thegoodscentscompany.com/data/es1004051.html"], "alt": ["Green, pungent, peppery, spicy, woody terpy and piney, with a resinous nuance", "Mosciano, Perfumer & Flavorist 1999, quoted on TGSC", "https://www.thegoodscentscompany.com/data/es1004051.html"], "confuse": ["Smoke, and a church.", "The resin has a peppery, pine-like side that the church association hides. Smoke is a separate effect from other materials. Your palette uses one word for both; the resins evening splits them."], "role": "The most shared material on your side of the shelf after patchouli."}, "freesia": {"name": "Freesia (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "galbanum": {"name": "Galbanum", "tier": "A", "phase": "top", "descriptors": "fresh green cortex earthy rooty woody balsamic metallic", "source": ["Galbanum oil, The Good Scents Company (Luebke 1988)", "https://www.thegoodscentscompany.com/data/es1005331.html"], "alt": ["Clean, sharp leafy green and powerful top note. Soft fruity caramel dry down", "IFF, quoted on The Good Scents Company", "https://www.thegoodscentscompany.com/data/es1005331.html"], "confuse": ["Green leaves, which is what the Trudon II list says instead.", "Galbanum is the bitter, sharp, almost turpentine green at the top of Rain Wood. Only one bottle on your shelf lists it, so it is learned by difference, not by intersection."]}, "gardenia": {"name": "Gardenia (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "grapefruit": {"name": "Grapefruit", "tier": "A", "phase": "top", "descriptors": null, "source": null}, "green": {"name": "Green notes (unspecified)", "tier": "B", "phase": "top", "descriptors": null, "source": null, "confuse": ["Galbanum, violet leaf, cut grass.", "A category word. The material behind the grassiness you love in Trudon II is not named on its list."]}, "guaiac": {"name": "Guaiac wood", "aka": "listed on Bois d'Ebene as palo santo", "tier": "A", "phase": "base", "descriptors": "sweet dry woody spicy powdery balsamic tea rose oriental copaiba", "source": ["Guaiacwood oil, The Good Scents Company (Luebke 2017)", "https://www.thegoodscentscompany.com/data/es1005751.html"], "confuse": ["Cedar, and sometimes vetiver.", "Guaiac rarely travels alone. Its usual companion, cypriol, is described by IFF as having a nearly vetiver background, so the pair lands where most people's only two wood names live. Reaching for cedar here is the standard misreading, and it is the one you made on your first wearing day. The tell: guaiac turns sweet and powdery late; a juniper cedar never does."], "arc": "The sweetness and the powder arrive late and together, because they are one material rather than two events. Early on the smoke is what shows.", "role": "A base wood that also sweetens. A dry woody perfume can turn powdery at hour six with nothing sweet on its list because of this."}, "hawthorn": {"name": "Hawthorn (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "hay": {"name": "Hay", "tier": "A", "phase": "base", "descriptors": "Hay, Warm, Dried Apricot, Smoky.", "source": ["Hay absolute (Biolandes), Perfumer's Apprentice (product copy; secondary source)", "https://shop.perfumersapprentice.com/p-10342-hay-absolute-biolandes.aspx"], "confuse": ["Smoke and tonka.", "Your two campfire bottles both carry hay. Hay is sweet and dry; smoke is phenolic. The hay evening separates them on the same arm."]}, "honey": {"name": "Honey", "tier": "A", "phase": "base", "descriptors": "sweet honey floral honeysuckle sour waxy civet", "source": ["Phenylacetic acid, The Good Scents Company, the usual honey material", "https://www.thegoodscentscompany.com/data/rw1009911.html"], "alt": ["sweet honey balsam waxy hay tobacco spice", "Beeswax absolute, The Good Scents Company", "https://www.thegoodscentscompany.com/data/ab1029091.html"], "confuse": ["Something animal.", "The string ends in civet. Honey in perfume carries a faint animal edge that the jar does not."]}, "isoesuper": {"name": "Iso E Super", "aka": "not on any of your lists by name; often behind the word cedar", "tier": "A", "phase": "base", "descriptors": "Woody, Floral, Ambergris. Smooth, woody, amber with unique aspects giving a 'velvet' like sensation.", "source": ["Iso E Super (IFF), quoted on The Good Scents Company", "https://www.thegoodscentscompany.com/data/rw1020612.html"], "confuse": ["Cedar, and nothing at all.", "Many people smell it weakly or intermittently; its maker says so. Molecule 01 is Iso E Super alone, which is the only way to find out what it is to you."]} al orange blossom green stem honey", "source": ["Bitter orangeflower absolute Morocco, The Good Scents Company, citing Luebke 1982 and Mosciano 1998", "https://www.thegoodscentscompany.com/data/ab1018991.html"], "confuse": ["Neroli and jasmine.", "The absolute is heavier and more honeyed than neroli, the distilled oil of the same flower. Fleur d'Oranger 27 is mostly this."]}, "orris": {"name": "Orris", "aka": "iris root; the lists say iris", "tier": "A", "phase": "heart", "descriptors": "woody fatty violet fruity sweet floral warm", "source": ["Orris rhizome concrete butter (Iris pallida), The Good Scents Company (Luebke 1997)", "https://www.thegoodscentscompany.com/data/co1001091.html"], "alt": ["orris floral berry violet woody powdery", "Alpha-irone, The Good Scents Company", "https://www.thegoodscentscompany.com/data/rw1006691.html"], "confuse": ["Violet, for a real chemical reason.", "Orris runs on irones and violet on ionones, two related ketones, which is why the two names sit on top of each other in every note list. In your record iris appears only in bottles rated lower; De Los Santos puts it on frankincense, which tests whether the material or its company was the problem."], "arc": "Extraordinarily persistent, which is why it reads as the thing still there."}, "osmanthus": {"name": "Osmanthus", "tier": "A", "phase": "heart", "descriptors": "Sweet fruity plum berry ripe fruit waxy leather honey woody", "source": ["Osmanthus flower absolute, The Good Scents Company (Luebke 1996)", "https://www.thegoodscentscompany.com/data/ab1000081.html"], "confuse": ["Apricot and leather at once.", "A material with two faces; the string has both fruit and leather in it."]}, "oud": {"name": "Agarwood (oud)", "tier": "A", "phase": "base", "descriptors": null, "source": null}, "patchouli": {"name": "Patchouli", "tier": "A", "phase": "base", "descriptors": "woody old wood dry earthy weedy balsamic spicy minty", "source": ["Patchouli oil, The Good Scents Company (2017)", "https://www.thegoodscentscompany.com/data/es1031631.html"], "confuse": ["Vetiver.", "Eleven bottles across both collections list it, more than any other material, and it is in Ouranon and Sì alike. Damp, oily, camphor-edged earth; vetiver is the drier root beside it."]}, "pear": {"name": "Pear (accord)", "tier": "B", "phase": "top", "descriptors": "A green, fruity, sweet, aldehydic note reminiscent of pear", "source": ["Hexyl acetate, The Good Scents Company, as the typical pear material", "https://www.thegoodscentscompany.com/data/rw1003201.html"]}, "peony": {"name": "Peony (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "perubalsam": {"name": "Peru balsam", "tier": "A", "phase": "base", "descriptors": "sweet balsamic vanilla woody powdery resinous", "source": ["Peru balsam, The Good Scents Company (Luebke 1981)", "https://www.thegoodscentscompany.com/data/rs1000271.html"]}, "petitgrain": {"name": "Petitgrain", "aka": "the leaf and twig of the bitter orange tree", "tier": "A", "phase": "top", "descriptors": "Sweet floral clary stemmy neroli citrus", "source": ["Petitgrain Paraguay, Perfumer's Apprentice (product copy; secondary source)", "https://shop.perfumersapprentice.com/p-6567-petitgrain-paraguay.aspx"], "confuse": ["Neroli and orange blossom.", "Three products of one tree: neroli is the flower distilled, orange blossom absolute the flower extracted, petitgrain the leaves. Petitgrain is the green, woody, least sweet of the three."]}, "pine": {"name": "Pine", "aka": "and its neighbours cypress and juniper", "tier": "A", "phase": "top", "descriptors": "fresh christmas tree fruity tonka balsam", "source": ["Pine needle absolute, The Good Scents Company (Luebke 1988)", "https://www.thegoodscentscompany.com/data/ab1049381.html"], "confuse": ["Cypress and juniper, and the reference works themselves do it.", "The published string for cypress oil contains the word pine, and so does the one for juniper berry terpenes. The three conifers bleed into one another in the official vocabulary. The working distinction: pine is the sweetest and sappiest, cypress the driest and most herbal, juniper the most peppery, with a gin top note IFF name outright. Siberian pine on a list is often a fir."], "arc": "The terpenic lift goes early and a woody heart is what remains."}, "pineresin": {"name": "Pine resin (accord)", "aka": "on Arso's list", "tier": "B", "phase": "base", "descriptors": null, "source": null, "confuse": ["Frankincense.", "Both are terpenic resins; Arso lists them side by side."]}, "pinkpepper": {"name": "Pink pepper", "tier": "A", "phase": "top", "descriptors": null, "source": null, "confuse": ["Black pepper.", "A different plant: rosier, fruitier, less hot."]}, "pomelo": {"name": "Pomelo", "tier": "A", "phase": "top", "descriptors": null, "source": null}, "quince": {"name": "Quince (accord)", "tier": "B", "phase": "top", "descriptors": null, "source": null}, "raspberry": {"name": "Raspberry", "tier": "A", "phase": "top", "descriptors": "sweet berry jam raspberry ripe floral", "source": ["Raspberry ketone, The Good Scents Company", "https://www.thegoodscentscompany.com/data/rw1020772.html"]}, "rhubarb": {"name": "Rhubarb (accord)", "tier": "B", "phase": "top", "descriptors": null, "source": null}, "rose": {"name": "Rose", "tier": "A", "phase": "heart", "descriptors": "floral rose waxy honey spicy green cortex geranium metallic", "source": ["Rose absolute Bulgaria, The Good Scents Company", "https://www.thegoodscentscompany.com/data/ab1015131.html"], "confuse": ["Geranium.", "The rose string itself says geranium and metallic; the flower is less sweet than its reputation."]}, "rosemary": {"name": "Rosemary", "tier": "A", "phase": "top", "descriptors": null, "source": null, "confuse": ["Lavender, sage, camphor.", "The kitchen jar is the free anchor."]}, "saffron": {"name": "Saffron", "tier": "A", "phase": "top", "descriptors": "fresh herbal phenolic metallic rosemary tobacco spicy", "source": ["Safranal, The Good Scents Company (Luebke 2009)", "https://www.thegoodscentscompany.com/data/rw1016371.html"]}, "sage": {"name": "Sage (clary)", "tier": "A", "phase": "heart", "descriptors": "fresh herbal green tea woody weedy dry spicy sage powdery", "source": ["Clary sage oil France, The Good Scents Company (Luebke 1983)", "https://www.thegoodscentscompany.com/data/es1018512.html"]}, "sandalwood": {"name": "Sandalwood", "tier": "A", "phase": "base", "descriptors": "soft, warm, smooth, creamy, and milky precious-wood scent", "source": ["Sandalwood, Wikipedia, quoting a fragrance database (secondary source)", "https://en.wikipedia.org/wiki/Sandalwood"], "confuse": ["Cashmeran and the creamy musks.", "Most sandalwood on a modern list is a synthetic; the natural oil is scarce. What the word reliably means is a creamy, milky wood with no dryness in it."]}, "sap": {"name": "Tree sap (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "seaweed": {"name": "Seaweed absolute", "tier": "A", "phase": "base", "descriptors": "green herbal phenolic woody dry seaweed", "source": ["Seaweed absolute (Fucus vesiculosus), The Good Scents Company", "https://www.thegoodscentscompany.com/data/ab1050301.html"], "confuse": ["The sea, and something damp.", "The string says green, herbal, phenolic and woody before it says seaweed, and never says salt or fresh. Reviewers who split over Rose SaltifOlia split over exactly this: one read the phenolic side as damp, the other the green side as a beach."]}, "smoke": {"name": "Smoke (accord)", "aka": "listed as smoke or ash", "tier": "B", "phase": "base", "descriptors": "Smokey, leathery, phenolic, burnt wood.", "source": ["Birch tar rectified, Perfumer's Apprentice (product copy; secondary source), as the typical smoke material", "https://shop.perfumersapprentice.com/p-9567-birch-tar-rectified.aspx"], "confuse": ["Frankincense.", "Smoke is an effect built from materials like birch tar or cade. It is not the resin. Your record uses incense for both."]}, "sweetpea": {"name": "Sweet pea (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "thyme": {"name": "Thyme", "tier": "A", "phase": "top", "descriptors": null, "source": null}, "tiare": {"name": "Tiare", "tier": "A", "phase": "heart", "descriptors": null, "source": null}, "tobacco": {"name": "Tobacco", "tier": "B", "phase": "base", "descriptors": null, "source": null}, "tonka": {"name": "Tonka bean", "aka": "coumarin is the molecule that gives it its smell", "tier": "A", "phase": "base", "descriptors": "Sweet, herbaceous, warm, somewhat spicy, in dilution - hay like.", "source": ["Coumarin, Perfumer's Apprentice (product copy; secondary source)", "https://shop.perfumersapprentice.com/p-6038-coumarin-crystalline-powder.aspx"], "confuse": ["Hay and vanilla.", "Coumarin is hay's own molecule, so tonka and hay overlap by chemistry. Vanilla is the sweeter, creamier neighbour."]}, "tuberose": {"name": "Tuberose", "tier": "A", "phase": "heart", "descriptors": "floral sweet spicy honeysuckle balsam orangeflower ylang", "source": ["Tuberose absolute from concrete, The Good Scents Company (Luebke 1983)", "https://www.thegoodscentscompany.com/data/ab1005391.html"], "alt": ["Creamy floral green medicinal with a coconut and solar facet and sweet balsamic undertones", "IFF, quoted on The Good Scents Company", "https://www.thegoodscentscompany.com/data/ab1005391.html"], "confuse": ["Jasmine and gardenia.", "The creamy, coconut, slightly medicinal white floral. Nothing on your shelf contains it; Lys 41 and L'Interdit do."]}, "turpentine": {"name": "Turpentine", "tier": "B", "phase": "top", "descriptors": null, "source": null}, "vanilla": {"name": "Vanilla", "tier": "A", "phase": "base", "descriptors": "sweet vanilla bean balsamic caramellic creamy gourmand toffee powdery", "source": ["Vanilla bean absolute, The Good Scents Company", "https://www.thegoodscentscompany.com/data/ab1101871.html"]}, "vetiver": {"name": "Vetiver", "aka": "the root, not the grass above it", "tier": "A", "phase": "base", "descriptors": "woody earthy rooty balsam amber", "source": ["Vetiver oil Haiti, The Good Scents Company (Luebke 1984)", "https://www.thegoodscentscompany.com/data/es1011832.html"], "alt": ["Earthy, woody with guaiacwood-like notes, slight peppery, and balsamic with a smoky nuance", "Mosciano, Perfumer & Flavorist 2001, quoted on TGSC", "https://www.thegoodscentscompany.com/data/es1011832.html"], "confuse": ["Patchouli, both ways round, and guaiac.", "Mosciano's line has guaiacwood in it, so the wood you met on your first day turns up inside vetiver's own description. Against patchouli the axis is dry against sweet: vetiver reads sharper, like roots pulled out of soil; patchouli reads damper and oilier."], "arc": "A woody opening with a hint of smoke that deepens within minutes; Givaudan's Quentin Bisch says the grapefruit facets show as it evaporates.", "role": "A fixative that lengthens everything around it; an overdose dominates the whole composition. TGSC give it 400 hours on a strip."}, "violet": {"name": "Violet", "aka": "usually an ionone", "tier": "A", "phase": "heart", "descriptors": "sweet woody floral violet orris tropical fruity", "source": ["Alpha-ionone, The Good Scents Company, citing IFF, Givaudan and Bedoukian", "https://www.thegoodscentscompany.com/data/rw1011952.html"], "alt": ["green oily earthy leafy floral", "Violet leaf absolute, The Good Scents Company (Luebke 1983)", "https://www.thegoodscentscompany.com/data/ab1019171.html"], "confuse": ["Orris.", "Same family of ketones. Violet is the sweeter and more candied; the leaf is a different material entirely, green and cucumber-like."]}, "waterlily": {"name": "Water lily (accord)", "tier": "B", "phase": "heart", "descriptors": null, "source": null}, "whitemusk": {"name": "White musk", "aka": "the polycyclic musks, Galaxolide chief among them", "tier": "A", "phase": "base", "descriptors": "strong diffusive sweet floral musk", "source": ["Musk GX (Galaxolide), The Good Scents Company", "https://thegoodscentscompany.com/data/rw1104661.html"], "alt": ["sweet musk waxy dry powdery laundered cloth metallic animal tropical", "Habanolide (Firmenich), The Good Scents Company", "https://www.thegoodscentscompany.com/data/rw1103401.html"], "confuse": ["Clean laundry, for a sound reason.", "The polycyclics that carry white musk in perfume are the materials that scent detergent. If it reads as washing powder rather than skin, you are describing it accurately. Some people cannot smell one musk and can smell another; a blank on one arm and a clear reading on the other is a finding, not an error."], "role": "Fixative and softener. It does not go anywhere."}, "winelees": {"name": "Wine lees (accord)", "tier": "B", "phase": "top", "descriptors": null, "source": null}, "woods": {"name": "Woody notes (unspecified)", "tier": "B", "phase": "base", "descriptors": null, "source": null}, "ylang": {"name": "Ylang-ylang", "tier": "A", "phase": "heart", "descriptors": "floral flower petal neroli lily spicy", "source": ["Ylang ylang flower oil, The Good Scents Company", "https://www.thegoodscentscompany.com/data/es1012152.html"]}}, "units": [{"key": "u01", "kind": "instrument", "title": "The instrument", "label": ["Paper", "30 minutes, then a rack", "Solo"], "need": ["Three strips: Trudon II, Bois d'Ebene, Blanche. Write the bottle's name on the tip of each before you spray.", "Paper clips. Whenever a read has to be blind, fold the named tip under a clip, shuffle the strips face-down, read, guess, then unclip. This is the whole blinding method of the course; no second person is needed for any of it.", "A timer. A place where the strips can lie flat, apart from each other, for two days."], "do": ["Spray one pass on each strip and wait ninety seconds for the alcohol to go.", "Smell each strip the way the method says: two or three short sniffs, a few centimetres off, twenty seconds of air between strips. One word each. These three are as far apart as your shelf gets; the words should come easily.", "Adaptation, felt: hold the Trudon II strip under your nose and breathe normally. Note the second at which it thins. Step away, smell the inside of your elbow, come back after one minute, two, three. The minute at which it is loud again is your recovery time. It goes at the top of every session from now on.", "The clip drill: fold the three tips under clips, shuffle face-down, pick one, one word, then unclip. Three strips this far apart should come out right; the drill is here so the mechanics are familiar before a session where the answer is not obvious.", "Leave the strips on the rack. Smell them again at one hour, at four hours, and tomorrow morning. Which one is still there, and what is it now?"], "why": "A strip kept for two days is a free evaporation curve, the tool Carles built his method on. Adaptation is central, not receptor fatigue: recordings at the epithelium show the signal holding while the reported intensity falls (Mignot et al. 2021), and the recovery is fast in clean air (Dalton 2000). Knowing your own number lets you pace a session instead of guessing.", "fields": [["recovery", "Recovery time, in minutes"], ["words", "Your three words, and the clip drill result"], ["rack", "The rack at one hour, four hours, next morning"]], "sources": [["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"], ["Mignot et al., Olfactory adaptation: recordings from the human olfactory epithelium, Eur Arch Otorhinolaryngol 2021", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9130158/"], ["Dalton, Psychophysical and behavioral characteristics of olfactory adaptation, Chemical Senses 2000", "https://academic.oup.com/chemse/article/25/4/487/342753"], ["Victoria Frolova, Perfume shopping tips, Bois de Jasmin, December 2010", "https://boisdejasmin.com/2010/12/perfume-fragrance-shopping-tips.html"]], "n": 1, "puzzles": []}, {"key": "u02", "kind": "paper", "title": "Woods: cedar and guaiac", "label": ["Paper", "Spray at 18:00, read at 21:00", "Two puzzles, one contrast"], "intro": "On your first wearing day you called the wood in Bois d'Ebene cedar. The list has guaiac and no cedar. Tonight the two are side by side.", "need": ["Four strips, named on the back: Bois d'Ebene, Vetiver 46, Arso, Angelica. Spray at 18:00 and leave them; the woods are base materials and the tops are in the way until they have gone.", "A pencil sharpener and a small glass: a few pencil shavings, covered. The free anchor for cedar."], "puzzles": [{"a": "matiere-premiere-bois-d-ebene", "b": "le-labo-vetiver-46", "target": ["guaiac"], "read": "3:00", "find": 1, "mode": "intersection", "ask": "Bois d'Ebene and Vetiver 46 share exactly one listed material. Smell one, wait twenty seconds, smell the other, five or six times. Write the one smell that is in both."}, {"a": "profumum-roma-arso", "b": "perfumer-h-angelica", "target": ["cedar"], "read": "3:00", "find": 1, "mode": "intersection", "ask": "Arso and Angelica share exactly one listed material. Same procedure. Smell the pencil glass before you write: is it on one of these strips, and which?"}], "contrast": {"a": "matiere-premiere-bois-d-ebene", "b": "profumum-roma-arso", "read": "3:00", "ask": "Two half-sentences: guaiac is ___ where cedar is ___, and the reverse."}, "after": "Tomorrow morning, all four strips off the rack: which wood is still there, and how did it change overnight? One line each.", "why": "A material is fixed in memory by the material it is not; Carles had beginners smell contrasting materials first and neighbours within a family second, always against each other. Guaiac is learned here at three hours because by then the mixture has shrunk to the three or four things a nose can hold (Laing and Francis 1989), and against a control, because a familiar target is far easier to find inside a mixture than an unfamiliar one (Thomas-Danguin et al. 2014).", "sources": [["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"], ["Laing and Francis, The capacity of humans to identify odors in mixtures, Physiology and Behavior 1989", "https://pubmed.ncbi.nlm.nih.gov/2628992/"], ["Thomas-Danguin et al., The perception of odor objects in everyday life: a review on the processing of odor mixtures, Frontiers in Psychology 2014", "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2014.00504/full"]], "n": 2}, {"key": "u03", "kind": "paper", "title": "Resins: frankincense, myrrh, elemi", "label": ["Paper", "Two reads: 0:15 and 3:00", "Three puzzles, one sum"], "need": ["Five strips: Ouranon, Citrus Batikanga, Hinoki, Perfumer H Bergamot, Angelica. Spray all five at once and read twice: once at fifteen minutes for the elemi, once at three hours for the two heavier resins.", "A sixth strip, Rain Wood, sprayed with the others and read last at three hours. It carries all three resins; the task is to point at each."], "puzzles": [{"a": "perfumer-h-angelica", "b": "aesop-ouranon", "target": ["lavender", "elemi"], "read": "0:15", "find": 2, "mode": "intersection", "ask": "Angelica and Ouranon share two listed materials, and both are early ones. At fifteen minutes, write what is on both strips. Two things; the lemony, peppery one is the subject."}, {"a": "aesop-ouranon", "b": "maison-crivelli-citrus-batikanga", "target": ["myrrh"], "read": "3:00", "find": 1, "mode": "intersection", "ask": "Ouranon and Citrus Batikanga share exactly one listed material. At three hours, what is on both?"}, {"a": "comme-des-garcons-monocle-scent-one-hinoki", "b": "perfumer-h-bergamot", "target": ["frankincense"], "read": "3:00", "find": 1, "mode": "intersection", "ask": "Hinoki and Bergamot share exactly one listed material. At three hours, what is on both?"}], "after": "Rain Wood at three hours, last. Point at the three resins in it, in your words. Then one line: which of the three is the cold lemon-pine one, which the bitter dark one, which the peppery church one.", "why": "Elemi leaves the paper early; TGSC give it 20 hours on a strip against 188 for frankincense and 400 for myrrh. Reading it at fifteen minutes and the others at three hours is the difference between finding it and having it gone. Six of your seven excellent bottles carry at least one of these three, so this is the vocabulary of your own taste.", "sources": [["Laing and Francis, The capacity of humans to identify odors in mixtures, Physiology and Behavior 1989", "https://pubmed.ncbi.nlm.nih.gov/2628992/"], ["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"]], "n": 3}, {"key": "u04", "kind": "paper", "title": "Greens and conifers", "label": ["Paper", "Reads at 0:10 and 1:00", "Two puzzles, one difference, three anchors"], "need": ["Five strips: Bois d'Ebene, Trudon II, Rain Wood, Eau de Sens ({Ps}), Angelica. These are early materials; the first read is at ten minutes.", "Free anchors from the kitchen and the street: a splash of gin in a glass (juniper), a sprig of rosemary, and if you can, a crushed spruce or pine tip."], "puzzles": [{"a": "matiere-premiere-bois-d-ebene", "b": "maison-trudon-ii", "target": ["juniper"], "read": "0:10", "find": 1, "mode": "intersection", "ask": "Bois d'Ebene and Trudon II share exactly one listed material, and it is loud only in the first quarter hour. What is on both? Smell the gin before you write."}, {"a": "perfurmer-h-rain-wood", "b": "diptique-eau-de-sens", "target": ["angelica", "juniper", "patchouli"], "read": "1:00", "find": 1, "mode": "intersection", "ask": "Rain Wood and Eau de Sens share three listed materials. Juniper you have just met and patchouli comes later. Find the third: a green root that turns musky."}, {"a": "perfurmer-h-rain-wood", "b": "perfumer-h-angelica", "target": ["galbanum"], "read": "0:10", "find": 1, "mode": "difference", "ask": "Rain Wood and Angelica share four listed materials. What Rain Wood has at ten minutes that Angelica does not is one thing: bitter, sharp, almost turpentine. Write it."}], "after": "Trudon II at ten minutes, again. The grassiness you love is on its list as green leaves, which is a description, not a material. Give it your own word; it is the only handle you will have until a nose you trust names it.", "why": "Galbanum sits in one bottle on the shelf, so it cannot be learned by intersection; it is learned by difference, and the difference has to be read early because it is a top material. The three conifers bleed into one another even in the trade's own vocabulary (the TGSC string for cypress contains the word pine), which is why the anchors are real plants rather than words.", "sources": [["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"], ["Thomas-Danguin et al., The perception of odor objects in everyday life: a review on the processing of odor mixtures, Frontiers in Psychology 2014", "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2014.00504/full"]], "n": 4}, {"key": "u05", "kind": "paper", "title": "Hay against smoke", "label": ["Paper", "Reads at 0:15 and 4:00", "One shared core, one split"], "intro": "Your two campfire bottles share a core and then part ways. Ouranon goes to lavender, camomile and tonka; Fuego Futuro goes to smoke, sage, mate and ash.", "need": ["Two strips: Ouranon, Fuego Futuro. Spray together, read at fifteen minutes and at four hours."], "puzzles": [{"a": "aesop-ouranon", "b": "thomas-de-monaco-fuego-futuro", "target": ["elemi", "hay", "frankincense"], "read": "0:15", "find": 3, "mode": "intersection", "ask": "Ouranon and Fuego Futuro share three listed materials. At fifteen minutes, write what is on both strips; you have met two of the three already."}, {"a": "aesop-ouranon", "b": "thomas-de-monaco-fuego-futuro", "target": ["hay"], "read": "4:00", "find": 1, "mode": "core", "ask": "At four hours, the shared thing that is sweet and dry. Then, on the Fuego strip only, the thing that is phenolic, like a struck match. Two words: one for the hay, one for the smoke."}], "after": "Which of your campfire bottles is led by hay and which by smoke? One line, in your words.", "why": "Hay's own molecule is coumarin, which is also what tonka smells of, so Ouranon's sweetness at four hours has two sources on its list. Smoke is an effect built from phenolic materials and is not on Ouranon's list at all. If both strips read as smoky to you at four hours, that is a finding about the word, and it goes in the ledger as one.", "sources": [["Thomas-Danguin et al., The perception of odor objects in everyday life: a review on the processing of odor mixtures, Frontiers in Psychology 2014", "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2014.00504/full"]], "n": 5}, {"key": "u06", "kind": "paper", "title": "Roots and moss", "label": ["Paper", "Spray at 17:00, read at 21:00", "Three puzzles, one across the boundary"], "need": ["Five strips: Vetiver 46, Victrix, Lys Solaberg, Ouranon, Armani Si ({Ps}). Spray at 17:00; these are base materials and need four hours on paper."], "puzzles": [{"a": "le-labo-vetiver-46", "b": "profumum-roma-victrix", "target": ["vetiver"], "read": "4:00", "find": 1, "mode": "intersection", "ask": "Vetiver 46 and Victrix share exactly one listed material. What is on both at four hours?"}, {"a": "profumum-roma-victrix", "b": "maison-crivelli-lys-solaberg", "target": ["oakmoss"], "read": "4:00", "find": 1, "mode": "intersection", "ask": "Victrix and Lys Solaberg share exactly one listed material. What is on both?"}, {"a": "aesop-ouranon", "b": "giorgio-armani-s", "target": ["patchouli"], "read": "4:00", "find": 1, "mode": "intersection", "ask": "Ouranon and Si share exactly one listed material, across the two collections. What is on both? The first time a material you love turns up on a bottle you would never wear."}], "after": "Three earths on one rack: root, oil, moss. One word each, yours, then check them against the strings.", "why": "Patchouli is on eleven lists across the two collections, more than any other material. If you can find it, a third of both shelves becomes partly legible in one evening. The three materials here are the ones the trade itself confuses: the vetiver string contains guaiacwood, the oakmoss string contains seaweed and hay.", "sources": [["Laing and Francis, The capacity of humans to identify odors in mixtures, Physiology and Behavior 1989", "https://pubmed.ncbi.nlm.nih.gov/2628992/"]], "n": 6}, {"key": "u07", "kind": "paper", "title": "The invisible base", "label": ["Paper", "Spray at noon, read at 18:00", "Two puzzles, one shop visit"], "intro": "Two synthetics carry the end of your favourite bottle and of half the shelf. Neither is on your note lists as anything you could smell alone.", "need": ["Four strips: Trudon II, Rose SaltifOlia, De Los Santos, Armani Si ({Ps}). Spray at noon, read at six in the evening, when almost nothing else is left on them.", "Optional, another day: Ingredients, Vezenska 4. Molecule 01 on one forearm, Molecule 02 on the other, and an hour outside. 01 is Iso E Super alone; 02 is ambroxan alone."], "puzzles": [{"a": "maison-trudon-ii", "b": "maison-crivelli-rose-saltifolia", "target": ["cashmeran"], "read": "6:00", "find": 1, "mode": "intersection", "ask": "Trudon II and Rose SaltifOlia share exactly one listed material. At six hours, what is on both?"}, {"a": "byredo-de-los-santos", "b": "giorgio-armani-s", "target": ["ambroxan"], "read": "6:00", "find": 1, "mode": "intersection", "ask": "De Los Santos and Si share exactly one listed material. At six hours, what is on both? If the answer is nothing on either strip, write nothing; it is a result."}], "after": "What is Trudon II at bedtime, in your words? Then, if you did the shop visit: 01 and 02 at five minutes and at one hour, each as yes, faint or no, and whether you liked it.", "why": "Ambroxan and Iso E Super are the two materials people most often cannot smell, or smell intermittently. A receptor for both has been identified (Takase et al. 2025); in that study the genotype did not change whether people detected ambroxan, it changed how much they liked it. So the honest question is two questions: can you smell it, and do you want to. A blank is a result.", "sources": [["Takase et al., An odorant receptor for a key odor constituent of ambergris, Communications Biology 2025", "https://pmc.ncbi.nlm.nih.gov/articles/PMC12102163/"], ["Escentric Molecules, Molecule 01 (100% Iso E Super)", "https://www.escentric.com/products/molecule-01-100ml"], ["Escentric Molecules, Molecule 02 (ambroxan, pure and singular)", "https://www.escentric.com/collections/molecule-02"]], "n": 7}, {"key": "u08", "kind": "wear", "title": "On skin: myrrh", "label": ["Skin", "A full day, four alarms", "Ouranon left, Batikanga right"], "pair": {"left": "aesop-ouranon", "right": "maison-crivelli-citrus-batikanga"}, "intro": "These two share one listed material, myrrh, and nothing else. One you rated excellent; the other you called boring with nice spice. The day asks when the shared thing shows on each arm, and whether the boring bottle is boring at hour four.", "need": ["Clean skin, nothing else scented that morning.", "One spray each, inner forearm, no rubbing.", "Alarms at 0:10, 1:00, 4:00 and 8:00, set on the phone from the times the page prints."], "why": "Skin is warmer than paper and absorbs part of what lands on it (Saiyasombati and Kasting 2003), so a material's paper hour and skin hour differ. The prediction you write before applying comes from your ledger; the diff at the end points back at the entry that was wrong.", "sources": [["Saiyasombati and Kasting, Two-stage kinetic analysis of fragrance evaporation and absorption from skin, Int J Cosmetic Science 2003", "https://onlinelibrary.wiley.com/doi/10.1046/j.1467-2494.2003.00194.x"], ["Morrot, Brochet and Dubourdieu, The color of odors, Brain and Language 2001", "https://doi.org/10.1006/brln.2001.2493"]], "n": 8, "puzzles": []}, {"key": "u09", "kind": "paper", "title": "Aldehydes", "label": ["Paper", "Reads at 0:10 and 1:00", "One puzzle, timed"], "need": ["Two strips: Blanche ({Ps}), Perfumer H Bergamot. This one is over in an hour."], "puzzles": [{"a": "byredo-blanche", "b": "perfumer-h-bergamot", "target": ["aldehydes"], "read": "0:10", "find": 1, "mode": "intersection", "ask": "Blanche and Bergamot share exactly one listed material, and it is loud for about ten minutes. What is on both, right now? Then again at one hour: is it still there?"}], "after": "Bergamot is the bright citrus you bought and never rated. What does the aldehyde do to it that lemon alone would not?", "why": "The classic aldehydes are long, waxy molecules; the strings say waxy, soapy, metallic. They are the material behind clean and sparkling on a list, and they are gone by the half hour, which is why this is the only puzzle read at ten minutes and again at one hour.", "sources": [["Laing and Francis, The capacity of humans to identify odors in mixtures, Physiology and Behavior 1989", "https://pubmed.ncbi.nlm.nih.gov/2628992/"]], "n": 9}, {"key": "u10", "kind": "paper", "title": "White florals", "label": ["Paper", "Reads at 0:30 and 2:00", "Two puzzles from the other drawer"], "need": ["Five strips: Fleur d'Oranger 27, Flower by Kenzo L'Absolue ({Ps}), Lys 41 ({Ps}), L'Interdit ({Ps}), Nuit de Cellophane ({Ps}). Heart materials; read at half an hour and at two hours."], "puzzles": [{"a": "le-labo-fleur-d-oranger-27", "b": "kenzo-flower-by-kenzo-l-absolue", "target": ["orangeblossom"], "read": "0:30", "find": 1, "mode": "intersection", "ask": "Fleur d'Oranger 27 and Flower by Kenzo share exactly one listed material. What is on both?"}, {"a": "le-labo-lys-41", "b": "givenchy-l-interdit", "target": ["tuberose", "jasmine", "vanilla"], "read": "2:00", "find": 1, "mode": "intersection", "ask": "Lys 41 and L'Interdit share three listed materials. Nuit de Cellophane has jasmine and vanilla-adjacent sweetness and no tuberose. Find the one thing the first two have that the third does not: creamy, a little medicinal, coconut at the edge."}], "after": "Three white florals in one evening: orange blossom, jasmine, tuberose. Which one is the one you reject, and what is the word for why?", "why": "None of these three is on your side of the shelf, which is why they are easy to name and worth naming: Carles started beginners on contrasts, and a one-palette shelf cannot supply one. A word learned on a contrast is what lets you say, in a shop, what a floral you dislike is doing.", "sources": [["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"], ["Majid and Burenhult, Odors are expressible in language, as long as you speak the right language, Cognition 2014", "https://www.sciencedirect.com/science/article/abs/pii/S001002771300214X"]], "n": 10}, {"key": "u11", "kind": "paper", "title": "Musks", "label": ["Paper", "Spray at 15:00, read at 18:00 and 21:00", "Two puzzles, one blind-spot check"], "need": ["Three strips: Musc Eternel, English Pear and Sweet Pea, Aqua Celestia, all {Ps}. Spray at three, read at six and at nine in the evening.", "A fourth strip, Victrix, sprayed at the same time. It carries oakmoss and vetiver, which you have already found, and a musk. It is the control: if its base reads clearly at nine while the three musk strips read as nothing, the blank is a blind spot, not a faded strip."], "puzzles": [{"a": "mizensir-musc-eternel", "b": "jo-malone-london-english-pear-sweet-pea", "target": ["whitemusk"], "read": "3:00", "find": 1, "mode": "intersection", "ask": "Musc Eternel and English Pear share exactly one listed material. At three hours, what is on both? If the answer is soft paper and nothing else, write that."}, {"a": "jo-malone-london-english-pear-sweet-pea", "b": "maison-francis-kurkdjian-aqua-celestia", "target": ["whitemusk"], "read": "6:00", "find": 1, "mode": "intersection", "ask": "English Pear and Aqua Celestia share the same material. At six hours, is it there, and does it smell the same as it did on the other pair?"}], "after": "Four loudness ratings, 0 to 3, at nine o'clock. A musk strip at 0 with Victrix at 2 or 3 is a flag for a blind spot on that musk, and goes in the ledger as one.", "why": "Odour-blindness to musk is the oldest documented specific anosmia (Whissell-Buechy and Amoore 1973), it is inherited, and it is molecule-specific: a named receptor, OR4D6, drives blindness to Galaxolide (PLOS Genetics 2022) while other musks stay audible. A blank on one strip and a clear reading on another means two houses used two musks and you are blind to one. Victrix is the control: sprayed at the same hour and carrying materials you can already find, it says whether the paper has faded or your receptors have.", "sources": [["Whissell-Buechy and Amoore, Odour-blindness to musk: simple recessive inheritance, Nature 1973", "https://doi.org/10.1038/242271a0"], ["Li et al., From musk to body odor: decoding olfaction through genetic variation, PLOS Genetics 2022 (OR4D6 and Galaxolide)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8812863/"], ["Genetic variation in the human olfactory receptor OR5AN1 associates with the perception of musks, Chemical Senses 2023", "https://pubmed.ncbi.nlm.nih.gov/36625229/"]], "n": 11}, {"key": "u12", "kind": "wear", "title": "On skin: what the resins add", "label": ["Skin", "A full day, four alarms", "Rain Wood left, Angelica right"], "pair": {"left": "perfurmer-h-rain-wood", "right": "perfumer-h-angelica"}, "intro": "These two share angelica, elemi, black pepper and cedar. Rain Wood adds galbanum, myrrh, frankincense, juniper, patchouli and a water lily; Angelica adds grapefruit, bigarade, lavender, rosemary and ambrette. Same spine, two different bodies. The day asks what the resins do to a shared aromatic core across eight hours.", "need": ["Clean skin. One spray each, inner forearm.", "Alarms at 0:10, 1:00, 4:00 and 8:00."], "why": "Two bottles that share a core are the closest thing to a controlled experiment a finished perfume allows: the shared materials cancel and the difference is the resins. Your prediction for each band comes from what the paper evenings put in the ledger.", "sources": [["Saiyasombati and Kasting, Two-stage kinetic analysis of fragrance evaporation and absorption from skin, Int J Cosmetic Science 2003", "https://onlinelibrary.wiley.com/doi/10.1046/j.1467-2494.2003.00194.x"]], "n": 12, "puzzles": []}, {"key": "u13", "kind": "paper", "title": "Fruit, honey, rose", "label": ["Paper", "Reads at 0:30 and 3:00", "Three puzzles, one carrier"], "need": ["Six strips: Flower by Kenzo, Rose SaltifOlia, Lady Million ({Ps}), Nuit de Cellophane ({Ps}), Armani Si ({Ps}), Aqua Celestia ({Ps}). Plus Portrait of a Lady as the carrier of blackcurrant on your own side."], "puzzles": [{"a": "kenzo-flower-by-kenzo-l-absolue", "b": "maison-crivelli-rose-saltifolia", "target": ["rose"], "read": "0:30", "find": 1, "mode": "intersection", "ask": "Flower by Kenzo and Rose SaltifOlia share exactly one listed material. What is on both? One is a mainstream floral, the other a salty niche rose; the shared thing is the flower."}, {"a": "rabanne-lady-million", "b": "serge-lutens-nuit-de-cellophane", "target": ["jasmine", "honey"], "read": "3:00", "find": 1, "mode": "intersection", "ask": "Lady Million and Nuit de Cellophane share two listed materials. Jasmine you met on the white-floral evening. Find the other: sweet, waxy, a little animal at the end."}, {"a": "giorgio-armani-s", "b": "maison-francis-kurkdjian-aqua-celestia", "target": ["blackcurrant", "rose"], "read": "0:30", "find": 1, "mode": "intersection", "ask": "Si and Aqua Celestia share two listed materials. Rose you have just found. The other is green, sharp and jammy at once; Robertet's word for it is sulfur. Then smell Portrait of a Lady: it is there too, under the rose."}], "after": "Blackcurrant, honey, rose: three words you had no material for. Which of the three would you want more of, which never?", "why": "Cassis and honey are the two facets your shelf has no word for and your second nose's drawer has several. Rose is on your side once, in the bottle you find too strong; finding it in a mainstream floral and in a niche marine rose is the material learned in two settings, which is how it stops being a bottle and becomes a word.", "sources": [["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"]], "n": 13}, {"key": "u14", "kind": "paper", "title": "Iris, violet, marine", "label": ["Paper", "Reads at 1:00 and 3:00", "Two puzzles, one family"], "need": ["Five strips: Petrichor Plains, Musc Eternel ({Ps}), Blanche ({Ps}), Acqua di Gio Profondo ({Ps}), Abed ({Ps}). Plus Rose SaltifOlia for the marine family."], "puzzles": [{"a": "mihan-aromatics-petrichor-plains", "b": "mizensir-musc-eternel", "target": ["orris"], "read": "3:00", "find": 1, "mode": "intersection", "ask": "Petrichor Plains and Musc Eternel share exactly one listed material. At three hours, what is on both? Cold, rooty, powder; in your record it sits only in bottles you rated lower."}, {"a": "mihan-aromatics-petrichor-plains", "b": "byredo-blanche", "target": ["violet"], "read": "1:00", "find": 1, "mode": "intersection", "ask": "Petrichor Plains and Blanche share exactly one listed material. At one hour, what is on both? Sweeter and more candied than the iris beside it."}, {"a": "giorgio-armani-acqua-di-gi-profondo-parfum", "b": "maison-crivelli-rose-saltifolia", "target": ["marine"], "read": "1:00", "find": 1, "mode": "family", "ask": "Profondo, Rose SaltifOlia and Abed each list something from the sea: marine notes, seaweed, iodine. Smell the three in a row. Is there one thing they share, or three different things? Write what you find, in words, before the reveal."}], "after": "Iris and violet run on two related ketones and sit on top of each other in every note list. After tonight, one sentence that tells them apart, in your words.", "why": "Marine is a family, not a material: calone in one bottle, seaweed absolute in another, an iodine accord in a third. A family puzzle has no single right answer and the ledger records whatever you found. Iris is the material your record holds against; the puzzle puts it beside a white musk instead of beside rain and cardamom.", "sources": [["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"]], "n": 14}, {"key": "u15", "kind": "blind", "title": "Blind: four apart", "label": ["Paper, blind", "Reads at 1:00 and 3:00", "Four strips, clipped"], "candidates": ["aesop-ouranon", "thomas-de-monaco-fuego-futuro", "perfurmer-h-rain-wood", "profumum-roma-victrix"], "intro": "Four bottles far apart from each other, on four strips whose names are folded under a clip. Shuffle them face-down. For each strip: describe, name the materials you can find, commit to a bottle. Unclip only when all four have a guess.", "need": ["Four strips, the bottle's name on the tip, folded under a paper clip. Spray all four at once, shuffle face-down, and leave the clips alone until every strip has a guess.", "Two reads: one hour (the tops are still there) and three hours (the bases). Guess at both; the second guess may differ from the first, and the difference is part of the result.", "If someone else is around, the same four can go on skin instead, two at a time, with them applying; the page works the same way."], "why": "Naming a bottle from its materials is the skill the paper evenings were for. Running it blind protects the description from the label (Cormiea and Fischer 2023). At which hour naming becomes possible for you is the measurement.", "sources": [["Cormiea and Fischer, Odor discrimination is immune to the effects of verbal labels, Scientific Reports 2023", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9889793/"], ["Morrot, Brochet and Dubourdieu, The color of odors, Brain and Language 2001", "https://doi.org/10.1006/brln.2001.2493"]], "n": 15, "puzzles": []}, {"key": "u16", "kind": "blind", "title": "Blind: near neighbours", "label": ["Paper, blind", "Reads at 1:00 and 3:00", "Four strips, clipped"], "candidates": ["maison-trudon-ii", "mihan-aromatics-moonlark-ash", "comme-des-garcons-monocle-scent-one-hinoki", "perfurmer-h-rain-wood"], "intro": "Same design, harder set: four green-conifer-incense bottles that share most of their lists. Which neighbours you cannot separate is the result.", "need": ["Four strips, named on the tip and clipped, shuffled face-down. Reads at one hour and three hours.", "Write the guess at one hour before the read at three; do not revise it, add a second."], "why": "Discrimination between neighbours is what an expert nose has over a novice one; the receptors are the same, the organisation of memory differs (Royet et al. 2013; Parr et al. 2002). This is the within-family test Carles ran after the contrasts.", "sources": [["Royet et al., The impact of expertise in olfaction, Frontiers in Psychology 2013", "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2013.00928/full"], ["Parr, Heatherbell and White, Demystifying wine expertise, Chemical Senses 2002", "https://doi.org/10.1093/chemse/27.8.747"], ["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"]], "n": 16, "puzzles": []}, {"key": "u17", "kind": "layer", "title": "Layering, giorgio-armani-acqua-di-gi-profondo-parfum", "key": "mandarin", "read": "0:10"}, {"a": "perfumer-h-bergamot", "b": "maison-crivelli-lys-solaberg", "key": "bergamot", "read": "0:10"}, {"a": "perfumer-h-bergamot", "b": "byredo-blanche", "key": "aldehydes", "read": "0:10"}, {"a": "perfumer-h-bergamot", "b": "maison-francis-kurkdjian-aqua-celestia", "key": "neroli", "read": "0:10"}, {"a": "perfumer-h-bergamot", "b": "givenchy-l-interdit", "key": "bergamot", "read": "0:10"}, {"a": "serge-lutens-nuit-de-cellophane", "b": "giorgio-armani-acqua-di-gi-profondo-parfum", "key": "mandarin", "read": "0:10"}, {"a": "byredo-bal-d-afrique", "b": "maison-francis-kurkdjian-aqua-celestia", "key": "blackcurrant", "read": "0:10"}, {"a": "byredo-bal-d-afrique", "b": "giorgio-armani-s", "key": "blackcurrant", "read": "0:10"}, {"a": "maison-francis-kurkdjian-aqua-celestia", "b": "rabanne-lady-million", "key": "neroli", "read": "0:10"}, {"a": "maison-francis-kurkdjian-aqua-celestia", "b": "chanel-gabrielle", "key": "blackcurrant", "read": "0:10"}, {"a": "giorgio-armani-acqua-di-gi-profondo-parfum", "b": "chanel-gabrielle", "key": "mandarin", "read": "0:10"}, {"a": "giorgio-armani-s", "b": "chanel-gabrielle", "key": "blackcurrant", "read": "0:10"}], "bands": ["0:10", "1:00", "4:00", "8:00"], "partner": "your second nose", "partner_s": "your second nose's", "front": {"title": "Nose", "lede": "A course in smelling your own shelf, one material at a time.", "paras": [["What this is", "You own twenty-three bottles in one palette and cannot yet name what is in them. This course teaches the materials one at a time, from the bottles themselves, on paper strips, and keeps what you learn in your own words. At the end you can read a bottle's note list and say which of it is true on your skin, and put two bottles together with a prediction that holds more often than not."], ["How a session goes", "Most sessions are paper evenings of twenty minutes. Two strips that share exactly one listed material, sprayed and read at the hour that material is loudest; you write what both have in common, and only then does the page reveal the material, its published description, and what you wrote about it before. Some sessions are wearing days: a prediction written from your ledger, one bottle per forearm, four alarms, and at the end the difference between what you predicted and what you found. Two sessions are blind: four strips with their names folded under paper clips."], ["The loop", "A session ends with Finish and export. Paste the block at the end of nose-log.md, double-click Update_perfumes.command, and the page comes back with the session in its history. The browser keeps a copy meanwhile, so nothing is lost if you paste it later."], ["The tabs", "Next: the session to run, and why it is next. Sessions: all eighteen in order, with the dates you ran them. Shelf: every bottle, the house list in grey chips and your own list in ink as it grows; a bottle with three materials in your words shows yours first. Ledger: every material, your words first, the published words second, where it was found and where it could not be."], ["The end", "The last session reads the ledger back to you: every material you marked want more, against the materials that carry your excellent bottles. What sits outside the core and still drew you is the next direction, in material names you can take into a shop."]]}, "method": {"title": "How to smell", "paras": ["<b>Short sniffs, a few centimetres off.<\/b> Two or three quick inhales, then away. A long draw adapts the nose faster than it informs it; perceived intensity falls within a minute of steady exposure and comes back after a short break in clean air (Dalton 2000). Coffee beans do nothing measurable (Grosofsky et al. 2011); the inside of your elbow, a wool sleeve, or an open window is the reset.", "<b>A nose reads three or four things at once, and training does not raise that ceiling<\/b> (Laing and Francis 1989; Livermore and Laing 1996; reviewed in Thomas-Danguin et al. 2014). A bottle with twelve listed notes is unreadable fresh. It becomes readable at hour three, when most of its list has left. Every puzzle here asks for one material, and reads it at the hour when it is loudest.", "<b>Describe first, name second.<\/b> Write what you smell in your own words before the page shows you any list. A label changes what people say about a smell and leaves what they can tell apart untouched (Cormiea and Fischer 2023); expectation overrides trained noses, as 54 oenology students showed when they described a white wine dyed red in the vocabulary of red (Morrot et al. 2001). Your description is the record. The name is a lookup.", "<b>A material is what two bottles have in common.<\/b> You cannot buy vetiver alone off this shelf, but Vetiver 46 and Victrix share exactly one listed ingredient. What both strips have at hour four, that is vetiver. Where a material sits in one bottle only, it is learned by difference: two bottles that share everything except it.", "<b>Paper is the formula; skin is the perfume.<\/b> A strip runs faster, holds a scent for days and adds nothing of its own, which is why the puzzles use it (Delacourte). Skin is warmer, absorbs part of the dose, and differs between people (Saiyasombati and Kasting 2003), which is why the wearing days test a prediction on skin only after the paper has taught the material.", "<b>The note list is the house's claim, not the formula.<\/b> It is written for marketing, and it can name a material you cannot find or hide one you can (Bois de Jasmin 2011). The course starts from the lists because nothing else is available, and replaces them, bottle by bottle, with what you found. A material you cannot find twice on a bottle is marked unconfirmed on that bottle, and stays that way until your nose says otherwise."], "sources": [["Dalton, Psychophysical and behavioral characteristics of olfactory adaptation, Chemical Senses 2000", "https://academic.oup.com/chemse/article/25/4/487/342753"], ["Grosofsky, Haupert and Versteeg, An exploratory investigation of coffee and lemon scents and odor identification, Perceptual and Motor Skills 2011", "https://journals.sagepub.com/doi/10.2466/24.PMS.112.2.536-538"], ["Laing and Francis, The capacity of humans to identify odors in mixtures, Physiology and Behavior 1989", "https://pubmed.ncbi.nlm.nih.gov/2628992/"], ["Livermore and Laing, Influence of training and experience on the perception of multicomponent odor mixtures, J Exp Psychol HPP 1996", "https://pubmed.ncbi.nlm.nih.gov/8934843/"], ["Thomas-Danguin et al., The perception of odor objects in everyday life: a review on the processing of odor mixtures, Frontiers in Psychology 2014", "https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2014.00504/full"], ["Cormiea and Fischer, Odor discrimination is immune to the effects of verbal labels, Scientific Reports 2023", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9889793/"], ["Morrot, Brochet and Dubourdieu, The color of odors, Brain and Language 2001", "https://doi.org/10.1006/brln.2001.2493"], ["Sylvaine Delacourte, Testing a perfume (blog)", "https://www.sylvainedelacourte.com/"], ["Saiyasombati and Kasting, Two-stage kinetic analysis of fragrance evaporation and absorption from skin, Int J Cosmetic Science 2003", "https://onlinelibrary.wiley.com/doi/10.1046/j.1467-2494.2003.00194.x"], ["Victoria Frolova, What is the fragrance pyramid and perfume notes? Myth and reality, Bois de Jasmin, January 2011", "https://boisdejasmin.com/2011/01/fragrance-pyramid-and-perfume-notes-myth-and-reality.html"], ["Jean Carles, A method of creation in perfumery, 1961 (PDF)", "https://img.perfumerflavorist.com/files/base/allured/all/document/2007/04/pf.PF_32_05_038_07.pdf"]]}, "built": "2026-09-23 21:25"};

      h += '<tr><td class="k">' + esc(mname(k)) + '</td>' + BANDS.map(t => { const r = b.reads.find(x => x.t === t); const f = r && r.found.includes(k); const c = r && r.cant.includes(k); const e = exp && exp !== 'none' && BANDS.indexOf(t) <= BANDS.indexOf(exp); return '<td>' + (f ? 'found' : c ? 'not found' : '') + (e && !f && !c ? ' <span class="note">(expected)</span>' : '') + '</td>'; }).join('') + '</tr>';
    });
    h += '</table>';
    const missed = keys.filter(k => { const exp = (pr[id] || {})[k]; return exp && exp !== 'none' && !b.reads.some(r => r.found.includes(k)); });
    const surprise = keys.filter(k => { const exp = (pr[id] || {})[k]; return (!exp || exp === 'none') && b.reads.some(r => r.found.includes(k)); });
    if (missed.length) h += '<div class="words"><span class="d">Predicted, not found</span> ' + esc(missed.map(mname).join(', ')) + '</div>';
    if (surprise.length) h += '<div class="words"><span class="d">Found, not predicted</span> ' + esc(surprise.map(mname).join(', ')) + '</div>';
    const late = new Set(); b.reads.filter(r => r.t === '4:00' || r.t === '8:00').forEach(r => r.found.forEach(k => late.add(k)));
    h += '<div class="lbl">Your list for this bottle</div><div class="meta">What you found at four or eight hours. Tap to keep; this becomes the bottle\'s list in your words.</div><div class="chips">' + keys.map(k => chip(k, (b.yourlist || []).includes(k) ? 'found' : '', true)).join('') + '</div>';
    h += '<label class="f">Verdict, if it changed</label><input type="text" data-verdict="' + esc(id) + '" value="' + esc(b.verdict || '') + '"></div>';
  });
  return h;
}
function bodyBlind(u, s, L) {
  const cands = u.candidates; const union = []; cands.forEach(c => B[c].keys.forEach(k => { if (!union.includes(k)) union.push(k); }));
  let h = '<p class="note">Candidates: ' + esc(cands.map(c => B[c].display).join(', ')) + '. Four strips, names on the tips, tips under clips, shuffled face-down.</p>' + alarmsHtml(s, BLIND_BANDS);
  if (!s.applied) return h;
  const guess = (id, t) => (b, r) => '<label class="f">Which bottle is this</label><select data-guess="' + id + '|' + t + '">' + ['', ...cands].map(c => '<option value="' + esc(c) + '"' + ((r.guess || '') === c ? ' selected' : '') + '>' + esc(c ? B[c].display : '') + '</option>').join('') + '</select>';
  BLIND_BANDS.forEach(t => { h += '<div class="sec">' + esc(t) + '</div>'; [1, 2, 3, 4].forEach(i => { const id = 'strip-' + i; bottleRec(s, id, 'strip ' + i).medium = 'paper'; h += bandHtml(s, id, 'strip ' + i, t, union, guess(id, t)); }); });
  h += '<div class="sec">Unclip</div>';
  if (!s.entries.revealed) {
    h += '<div class="card"><p class="ask">Only when all four strips have a guess at both reads. Unfold the tips and enter which bottle each strip was.</p>';
    [1, 2, 3, 4].forEach(i => { const b = bottleRec(s, 'strip-' + i, ''); h += '<label class="f">Strip ' + i + '</label><select data-actual="strip-' + i + '">' + ['', ...cands].map(c => '<option value="' + esc(c) + '"' + ((b.actual || '') === c ? ' selected' : '') + '>' + esc(c ? B[c].display : '') + '</option>').join('') + '</select>'; });
    h += '<div class="row"><button class="btn warn" data-revealkey>Reveal</button></div></div>';
  } else {
    h += '<table class="grid"><tr><th>Strip</th><th>Was</th><th>Guess at 1:00</th><th>Guess at 3:00</th></tr>';
    [1, 2, 3, 4].forEach(i => { const b = bottleRec(s, 'strip-' + i, ''); const g = t => { const r = b.reads.find(x => x.t === t); return r && r.guess ? B[r.guess].display + (r.guess === b.actual ? ' (right)' : ' (wrong)') : ''; }; h += '<tr><td>' + i + '</td><td>' + esc(b.actual ? B[b.actual].display : '') + '</td><td>' + esc(g('1:00')) + '</td><td>' + esc(g('3:00')) + '</td></tr>'; });
    h += '</table>';
  }
  return h;
}
function bodyLayer(u, s, L) {
  const mine = DATA.bottles.filter(b => b.mine);
  let h = '<div class="sec">The pair</div><div class="card">';
  h += '<label class="f">Base bottle (alone on the right, under the other on the left)</label><select data-lay="base"' + (s.entries.pairLocked ? ' disabled' : '') + '>' + ['', ...DATA.bottles.map(b => b.id)].map(id => '<option value="' + esc(id) + '"' + ((s.entries.base || '') === id ? ' selected' : '') + '>' + esc(id ? B[id].display : '') + '</option>').join('') + '</select>';
  h += '<label class="f">Second bottle (left only)</label><select data-lay="top"' + (s.entries.pairLocked ? ' disabled' : '') + '>' + ['', ...DATA.bottles.map(b => b.id)].map(id => '<option value="' + esc(id) + '"' + ((s.entries.top || '') === id ? ' selected' : '') + '>' + esc(id ? B[id].display : '') + '</option>').join('') + '</select>';
  if (!s.entries.pairLocked) { h += '<div class="row"><button class="btn" data-lockpair>Keep this pair</button></div></div>'; return h; }
  h += '</div>';
  const base = s.entries.base, top = s.entries.top;
  const union = []; [base, top].forEach(c => B[c].keys.forEach(k => { if (!union.includes(k)) union.push(k); }));
  h += '<div class="sec">Prediction for the layered arm</div>' + predictionHtml(s, 'layer', 'left, both', union);
  if (!s.entries.predLocked) { h += '<div class="row"><button class="btn" data-lockpred>Commit the prediction</button></div>'; return h; }
  h += '<div class="sec">Apply</div>' + alarmsHtml(s);
  if (!s.applied) return h;
  BANDS.forEach(t => { h += '<div class="sec">' + esc(t) + '</div>' + bandHtml(s, 'layer', 'left, both', t, union) + bandHtml(s, base, 'right, base alone', t, B[base].keys); });
  const lay = (s.bottles || []).find(x => x.id === 'layer'), bb = (s.bottles || []).find(x => x.id === base);
  if (lay && bb) {
    h += '<div class="sec">What the second bottle did</div><table class="grid"><tr><th>Band</th><th>On the layered arm and not on the base</th><th>On the base and gone from the layered arm</th></tr>';
    BANDS.forEach(t => { const a = lay.reads.find(r => r.t === t), c = bb.reads.find(r => r.t === t); if (!a || !c) return; const add = a.found.filter(k => !c.found.includes(k)), lost = c.found.filter(k => !a.found.includes(k)); h += '<tr><td>' + esc(t) + '</td><td>' + esc(add.map(mname).join(', ')) + '</td><td>' + esc(lost.map(mname).join(', ')) + '</td></tr>'; });
    h += '</table>';
  }
  return h;
}
function bodyReading(u, s, L) {
  const core = new Set(); DATA.bottles.filter(b => b.mine && b.cls === 'complete').forEach(b => b.keys.forEach(k => core.add(k)));
  const more = Object.values(L).filter(e => e.pull === 'more');
  let h = '<div class="sec">Materials you marked want more</div>';
  if (!more.length) h += '<p class="note">None yet. The mark is set after a reveal on paper.</p>';
  more.forEach(e => { h += '<div class="words"><b>' + esc(mname(e.key)) + '</b>' + (core.has(e.key) ? ' <span class="d">in your core</span>' : ' <span class="d">outside your core</span>') + ': found in ' + esc(Object.keys(e.found_in).map(id => B[id] ? B[id].display : id).join(', ') || 'nothing yet') + (e.skin.length ? '; on skin ' + esc(e.skin.map(x => (B[x[0]] ? B[x[0]].display : x[0]) + ' ' + x[1]).join(', ')) : '') + '</div>'; });
  h += '<div class="sec">Avoid</div><p class="words">' + esc(Object.values(L).filter(e => e.pull === 'avoid').map(e => mname(e.key)).join(', ') || 'none marked') + '</p>';
  h += field(s, 'direction', 'The direction, in one paragraph', 'Material names, and the two bottles you own that come closest.');
  return h;
}

// ---------------------------------------------------------------- export ---
function exportMd(list) {
  return list.map(s => {
    const u = UBY[s.unit]; const lines = ['## ' + s.date + ' ' + (u ? 'U' + String(u.n).padStart(2, '0') + ' ' + u.title : s.title || s.unit), ''];
    (s.materials || []).forEach(m => lines.push('- ' + mname(m.key) + ' (' + (B[m.bottle] ? B[m.bottle].display : m.bottle) + ', ' + (m.t || '') + '): ' + (m.outcome || '') + (m.named ? ', named ' + m.named : '') + (m.confused_with ? ', confused with ' + m.confused_with : '') + (m.pull ? ', ' + m.pull : '') + '. ' + (m.words || '')));
    (s.bottles || []).forEach(b => (b.reads || []).forEach(r => lines.push('- ' + (B[b.id] ? B[b.id].display : b.id) + ' ' + r.t + ': ' + (r.words || '') + (r.found.length ? ' [found: ' + r.found.map(mname).join(', ') + ']' : ''))));
    if (s.closing) lines.push('', s.closing);
    lines.push('', '```json nose-session', JSON.stringify(s, null, 1), '```', '');
    return lines.join('\n');
  }).join('\n');
}
function ioBox(text, label) {
  const box = $('#io') || $('#main');
  box.innerHTML = '<div class="card"><h4>' + esc(label) + '</h4><textarea rows="8" id="iotext">' + esc(text) + '</textarea><div class="row"><button class="btn" data-copy>Copy</button><button class="btn ghost" data-download>Download .md</button></div><p class="note">Paste it at the end of nose-log.md, then run Update_perfumes.command.</p></div>';
  wire(box);
}
function importBox() {
  const box = $('#io');
  box.innerHTML = '<div class="card"><h4>Import</h4><p class="note">Paste the log, or any part of it holding nose-session blocks.</p><textarea rows="8" id="iotext"></textarea><div class="row"><button class="btn" data-doimport>Import</button></div></div>';
  wire(box);
}

// ---------------------------------------------------------------- wiring ---
function sess() { return currentSession(UBY[openUnit]); }
function wire(root) {
  $$('[data-open-unit]', root).forEach(el => el.onclick = () => show('unit', el.dataset.openUnit));
  $$('[data-open-session]', root).forEach(el => el.onclick = () => { const s = sessions().find(x => x.id === el.dataset.openSession); if (s) ioBox(exportMd([s]), 'Session ' + s.date); });
  $$('[data-start]', root).forEach(el => el.onclick = () => { newSession(UBY[el.dataset.start]); render(); });
  $$('[data-adhoc]', root).forEach(el => el.onclick = () => {
    const [a, b, k] = el.dataset.adhoc.split('|');
    const key = 'x-' + a + '-' + b;
    if (!UBY[key]) { const u = { key, n: '+', kind: 'paper', title: mname(k) + ': ' + B[a].display + ' and ' + B[b].display, label: ['Paper', 'Read at ' + (DATA.pool.find(p => p.a === a && p.b === b) || {}).read, 'Open puzzle'], need: ['Two strips, named on the back. Spray together and read at the hour shown.'], puzzles: [{ a, b, target: [k], read: (DATA.pool.find(p => p.a === a && p.b === b) || {}).read, find: 1, mode: 'intersection', ask: B[a].display + ' and ' + B[b].display + ' share exactly one listed material. What is on both?' }], sources: [] }; UNITS.push(u); UBY[key] = u; }
    show('unit', key);
  });
  $$('[data-export-all]', root).forEach(el => el.onclick = () => ioBox(exportMd(sessions().filter(s => store.sessions[s.id])), 'Everything this browser holds'));
  $$('[data-import]', root).forEach(el => el.onclick = importBox);
  $$('[data-doimport]', root).forEach(el => el.onclick = () => { const t = $('#iotext').value; let n = 0; const re = /```json nose-session\s*\n([\s\S]*?)\n```/g; let m; while ((m = re.exec(t))) { try { const s = JSON.parse(m[1]); if (s && s.id) { store.sessions[s.id] = s; n++; } } catch (e) {} } save(); render(); alert(n + ' sessions imported.'); });
  $$('[data-copy]', root).forEach(el => el.onclick = () => { const t = $('#iotext'); t.select(); try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } });
  $$('[data-download]', root).forEach(el => el.onclick = () => { const blob = new Blob([$('#iotext').value], { type: 'text/markdown' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nose-' + today() + '.md'; a.click(); });
  const s = openUnit ? sess() : null;
  if (!s) return;
  $$('[data-f]', root).forEach(el => el.oninput = () => { s[el.dataset.f] = el.value; save(); });
  $$('[data-e]', root).forEach(el => el.oninput = () => { s.entries[el.dataset.e] = el.value; save(); });
  $$('[data-e-seg]', root).forEach(seg => $$('button', seg).forEach(b => b.onclick = () => { s.entries[seg.dataset.eSeg] = b.dataset.o; save(); render(); }));
  // paper puzzles
  $$('[data-p]', root).forEach(el => el.oninput = () => { const e = s.entries[el.dataset.p] = s.entries[el.dataset.p] || {}; e[el.dataset.pf] = el.value; save(); const btn = $('[data-commit="' + el.dataset.p + '"]', root); if (btn) btn.disabled = !(e.words || '').trim(); });
  $$('[data-commit]', root).forEach(el => el.onclick = () => {
    const pid = el.dataset.commit; const e = s.entries[pid] = s.entries[pid] || {}; if (!(e.words || '').trim()) return;
    e.committed = now(); const p = UBY[openUnit].puzzles[Number(pid.slice(1))];
    p.target.forEach(k => { if (!matEntry(s, k, p.a)) s.materials.push({ key: k, bottle: p.a, other: p.b, t: p.read, words: e.words, named: e.named || '', outcome: '', pull: '' }); });
    save(); render();
  });
  $$('[data-out]', root).forEach(seg => $$('button', seg).forEach(b => b.onclick = () => { const [pid, k] = seg.dataset.out.split('|'); const p = UBY[openUnit].puzzles[Number(pid.slice(1))]; const m = matEntry(s, k, p.a); if (m) { m.outcome = b.dataset.o; if (m.outcome !== 'confused') m.confused_with = ''; save(); render(); } }));
  $$('[data-pull]', root).forEach(seg => $$('button', seg).forEach(b => b.onclick = () => { const [pid, k] = seg.dataset.pull.split('|'); const p = UBY[openUnit].puzzles[Number(pid.slice(1))]; const m = matEntry(s, k, p.a); if (m) { m.pull = b.dataset.o; save(); render(); } }));
  $$('[data-cw]', root).forEach(el => el.oninput = () => { const [pid, k] = el.dataset.cw.split('|'); const p = UBY[openUnit].puzzles[Number(pid.slice(1))]; const m = matEntry(s, k, p.a); if (m) { m.confused_with = el.value; save(); } });
  // wearing / blind / layer
  $$('[data-band]', root).forEach(seg => $$('button', seg).forEach(b => b.onclick = () => { if (seg.dataset.locked) return; const [id, k] = seg.dataset.band.split('|'); s.entries.pred = s.entries.pred || {}; s.entries.pred[id] = s.entries.pred[id] || {}; s.entries.pred[id][k] = b.dataset.o; save(); render(); }));
  $$('[data-predtext]', root).forEach(el => el.oninput = () => { const id = el.dataset.predtext; s.entries.pred = s.entries.pred || {}; s.entries.pred[id] = s.entries.pred[id] || {}; s.entries.pred[id]._text = el.value; save(); });
  $$('[data-lockpred]', root).forEach(el => el.onclick = () => { s.entries.predLocked = now(); save(); render(); });
  $$('[data-apply]', root).forEach(el => el.onclick = () => { s.applied = now(); save(); render(); });
  $$('[data-copy-alarms]', root).forEach(el => el.onclick = () => { try { navigator.clipboard.writeText(el.dataset.copyAlarms); } catch (e) {} });
  $$('[data-read]', root).forEach(el => el.oninput = () => { const [id, t] = el.dataset.read.split('|'); const r = readRec(bottleRec(s, id, ''), t); r.words = el.value; save(); const btn = $('[data-saveread="' + id + '|' + t + '"]', root); if (btn) btn.disabled = !el.value.trim(); });
  $$('[data-saveread]', root).forEach(el => el.onclick = () => { const [id, t] = el.dataset.saveread.split('|'); const r = readRec(bottleRec(s, id, ''), t); if (!(r.words || '').trim()) return; r.saved = true; r.at = now(); save(); render(); });
  $$('[data-new]', root).forEach(el => el.oninput = () => { const [id, t] = el.dataset.new.split('|'); readRec(bottleRec(s, id, ''), t).newsince = el.value; save(); });
  $$('.card .chips .chip.tap', root).forEach(ch => ch.onclick = () => {
    const card = ch.closest('.card'); const ta = $('[data-read]', card); const k = ch.dataset.k;
    if (ta) { const [id, t] = ta.dataset.read.split('|'); const r = readRec(bottleRec(s, id, ''), t);
      if (r.found.includes(k)) { r.found = r.found.filter(x => x !== k); r.cant.push(k); } else if (r.cant.includes(k)) { r.cant = r.cant.filter(x => x !== k); } else { r.found.push(k); }
      save(); render(); return; }
    const vd = $('[data-verdict]', card); if (vd) { const b = bottleRec(s, vd.dataset.verdict, ''); b.yourlist = b.yourlist || []; if (b.yourlist.includes(k)) b.yourlist = b.yourlist.filter(x => x !== k); else b.yourlist.push(k); save(); render(); }
  });
  $$('[data-verdict]', root).forEach(el => el.oninput = () => { bottleRec(s, el.dataset.verdict, '').verdict = el.value; save(); });
  $$('[data-guess]', root).forEach(el => el.onchange = () => { const [id, t] = el.dataset.guess.split('|'); readRec(bottleRec(s, id, ''), t).guess = el.value; save(); });
  $$('[data-actual]', root).forEach(el => el.onchange = () => { bottleRec(s, el.dataset.actual, '').actual = el.value; save(); });
  $$('[data-revealkey]', root).forEach(el => el.onclick = () => { const act = [1, 2, 3, 4].map(i => bottleRec(s, 'strip-' + i, '').actual); if (act.some(a => !a) || new Set(act).size !== 4) { alert('Four different bottles, one per strip.'); return; } s.entries.revealed = now(); save(); render(); });
  $$('[data-goto]', root).forEach(el => el.onclick = () => show(el.dataset.goto));
  $$('[data-lay]', root).forEach(el => el.onchange = () => { s.entries[el.dataset.lay] = el.value; save(); });
  $$('[data-lockpair]', root).forEach(el => el.onclick = () => { if (!s.entries.base || !s.entries.top || s.entries.base === s.entries.top) { alert('Two different bottles.'); return; } s.entries.pairLocked = now(); save(); render(); });
  $$('[data-finish]', root).forEach(el => el.onclick = () => { s.done = true; s.finished = now(); save(); ioBox(exportMd([s]), 'Session ' + s.date + ', paste into the log'); });
  $$('[data-discard]', root).forEach(el => el.onclick = () => { if (confirm('Discard this session and everything written in it?')) { delete store.sessions[s.id]; save(); render(); } });
}
$$('nav.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
show(view);
